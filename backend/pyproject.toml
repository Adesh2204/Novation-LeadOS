[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novation-leados"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "pydantic-settings>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3,<4",
  "PyYAML>=6,<7", "pgvector>=0.3,<1", "google-auth[requests]>=2,<3", "httpx>=0.27,<1",
  "openai>=3.26,<4", "exa-py>=2.25,<3", "firecrawl-py>=4.49,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["leados*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["leados"]
